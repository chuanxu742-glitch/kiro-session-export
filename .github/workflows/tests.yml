name: tests

on:
  push:
  pull_request:

jobs:
  unittest-and-standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library tests
        run: python -m unittest discover -v
      - name: Build standalone script
        run: python tools/build_standalone.py
      - name: Check standalone help
        run: python dist/kiro-md.py --help
